services:
  mariadb:
    image: mariadb:11.4
    env_file:
      - ./ONDE-backend/.env
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./DB_Seed:/tmp/DB_Seed:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2022-05-08T23-50-31Z
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - ./ONDE-backend/.env
    volumes:
      - ./S3_Mock:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--requirepass", "onde-local-redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "onde-local-redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./ONDE-backend
      args:
        MODULE: api-module
    env_file:
      - ./ONDE-backend/.env
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/onde
      REDIS_HOST: redis
      REDIS_PASSWORD: onde-local-redis
      AWS_S3_ENDPOINT: http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  admin:
    build:
      context: ./ONDE-backend
      args:
        MODULE: admin-module
    env_file:
      - ./ONDE-backend/.env
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/onde
      REDIS_HOST: redis
      REDIS_PASSWORD: onde-local-redis
      AWS_S3_ENDPOINT: http://minio:9000
    ports:
      - "8081:8081"
    depends_on:
      api:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - ./ONDE-frontend/.env
    volumes:
      - ./ONDE-frontend:/app
      - frontend-node-modules:/app/node_modules
    command: ["sh", "-lc", "npm ci && npm run build && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ | grep -q '<div id=\"root\"'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  db-seeder:
    image: mariadb:11.4
    env_file:
      - ./ONDE-backend/.env
    volumes:
      - ./DB_Seed:/tmp/DB_Seed:ro
    depends_on:
      api:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Checking database schema readiness...' &&
        mariadb -hmariadb -uroot -p\"$$MARIADB_ROOT_PASSWORD\" onde < /tmp/DB_Seed/load_data.sql &&
        echo 'Seed data loaded successfully!'
      "

volumes:
  mariadb-data:
  frontend-node-modules:
